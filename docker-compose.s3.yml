# S3-compatible object storage (MinIO) with server-side encryption.
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml up --build
# Requires MINIO_ROOT_PASSWORD and MINIO_KMS_SECRET_KEY in .env (deploy/gen-secrets.sh prints both).

x-s3-env: &s3-env
  AUDITFLOW_STORAGE_BACKEND: s3
  AUDITFLOW_S3_ENDPOINT_URL: http://minio:9000
  AUDITFLOW_S3_BUCKET: auditflow
  AUDITFLOW_S3_ACCESS_KEY: auditflow
  AUDITFLOW_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  AUDITFLOW_S3_SERVER_SIDE_ENCRYPTION: AES256

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: auditflow
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Enables SSE-S3 (encryption at rest) with a single static key; use an external KMS in production.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY in .env}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    environment: *s3-env
    depends_on:
      minio:
        condition: service_healthy

  worker:
    environment: *s3-env
    depends_on:
      minio:
        condition: service_healthy

volumes:
  minio:
