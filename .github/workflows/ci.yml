name: CI

on:
  push:
    # AuditFlow lives on its own branch, independent from `master` (see CLAUDE.md §1).
    branches: [main, master, claude/new-session-s0mlha]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auditflow
          POSTGRES_PASSWORD: auditflow
          POSTGRES_DB: auditflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U auditflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://auditflow:auditflow@localhost:5432/auditflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration and golden-parity tests
        run: npm test
      - name: Evals on the demo kit (spec §14)
        run: npm run evals -- --out evals-out
        env:
          EVALS_DATABASE_URL: postgresql://auditflow:auditflow@localhost:5432/auditflow_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evals
          path: evals-out/
      - name: Build
        run: npm run build
      - name: Analyzed demo for the end-to-end run
        env:
          PGPASSWORD: auditflow
          DATABASE_URL: postgresql://auditflow:auditflow@localhost:5432/auditflow
          AUDITFLOW_DEMO_PASSWORD: e2e-demo-password
        run: |
          psql -h localhost -U auditflow -d auditflow_test -c "CREATE DATABASE auditflow"
          npm run db:migrate
          npm run seed -- --reset --analyze
      - name: End-to-end (Playwright)
        env:
          DATABASE_URL: postgresql://auditflow:auditflow@localhost:5432/auditflow
          AUDITFLOW_DEV_AUTH: "1"
          AUDITFLOW_SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          AUDITFLOW_DEMO_PASSWORD: e2e-demo-password
          E2E_PASSWORD: e2e-demo-password
        run: |
          npx playwright install --with-deps chromium
          nohup npm start > web.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http://localhost:3000/login http://localhost:3000/api/health
          npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e
          path: |
            playwright-report/
            test-results/
            web.log
