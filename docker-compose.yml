# Local stack: PostgreSQL, Redis, API, worker and web app. Secrets come from .env (see .env.example).
#   cp .env.example .env && ./deploy/gen-secrets.sh >> .env
#   docker compose up --build
#   docker compose exec api python -m app.seed --analyze      # optional: the three demo companies
# Object storage defaults to a shared volume; add docker-compose.s3.yml for an S3-compatible store (MinIO).

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    AUDITFLOW_ENV: prod
    AUDITFLOW_DATABASE_URL: postgresql+psycopg://auditflow:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/auditflow
    AUDITFLOW_SECRET_KEY: ${AUDITFLOW_SECRET_KEY:?set AUDITFLOW_SECRET_KEY in .env}
    AUDITFLOW_DEMO_PASSWORD: ${AUDITFLOW_DEMO_PASSWORD:-}
    AUDITFLOW_JOB_BACKEND: rq
    AUDITFLOW_REDIS_URL: redis://redis:6379/0
    AUDITFLOW_STORAGE_BACKEND: local
    AUDITFLOW_CORS_ORIGINS: '["http://localhost:3000"]'
    # Set to true as soon as the app is served over HTTPS.
    AUDITFLOW_COOKIE_SECURE: ${AUDITFLOW_COOKIE_SECURE:-false}
    AUDITFLOW_LLM_PROVIDER: ${AUDITFLOW_LLM_PROVIDER:-none}
    AUDITFLOW_ANTHROPIC_API_KEY: ${AUDITFLOW_ANTHROPIC_API_KEY:-}
  volumes:
    - storage:/srv/var/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auditflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: auditflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditflow -d auditflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 12

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        AUDITFLOW_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  storage:
